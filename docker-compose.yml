name: nexusssh
x-app-env: &app-env
  APP_URL: ${APP_URL:?set APP_URL}
  DATABASE_URL: file:/app/data/nexusssh.db
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY}
  SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET}
  INTERNAL_SECRET: ${INTERNAL_SECRET:?set INTERNAL_SECRET}
  SETUP_TOKEN: ${SETUP_TOKEN:-}
  AUTH_ISSUER: ${AUTH_ISSUER:?set AUTH_ISSUER}
  AUTH_AUDIENCE: ${AUTH_AUDIENCE:-nexusssh}
  MCP_PUBLIC_URL: ${MCP_PUBLIC_URL:?set MCP_PUBLIC_URL}
  MCP_AUTH_ISSUER: ${MCP_AUTH_ISSUER:?set MCP_AUTH_ISSUER}
  ENCRYPTION_KEY_PROVIDER: ${ENCRYPTION_KEY_PROVIDER:-environment}
  SSH_ALLOWED_CIDRS: ${SSH_ALLOWED_CIDRS:?set SSH_ALLOWED_CIDRS}
  SSH_CONNECT_TIMEOUT: ${SSH_CONNECT_TIMEOUT:-10000}
  SSH_IDLE_TIMEOUT: ${SSH_IDLE_TIMEOUT:-300000}
  SSH_MAX_SESSIONS: ${SSH_MAX_SESSIONS:-20}
  SSH_OUTPUT_LIMIT: ${SSH_OUTPUT_LIMIT:-1048576}
  AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-90}
  LOG_LEVEL: ${LOG_LEVEL:-info}
services:
  api:
    image: nexusssh-api:latest
    build: {context: ., dockerfile: infrastructure/docker/Dockerfile, target: backend}
    environment:
      <<: *app-env
      NODE_ENV: production
      DATABASE_URL: file:/app/data/nexusssh.db
      REDIS_URL: redis://redis:6379
      INTERNAL_API_URL: http://api:3001
    volumes: [nexusssh_data:/app/data]
    restart: unless-stopped
    init: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    depends_on:
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
  web:
    image: nexusssh-web:latest
    build: {context: ., dockerfile: infrastructure/docker/Dockerfile, target: web}
    environment: {API_URL: 'http://api:3001', NEXT_TELEMETRY_DISABLED: '1'}
    restart: unless-stopped
    init: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 10
  mcp:
    image: nexusssh-mcp:latest
    build: {context: ., dockerfile: infrastructure/docker/Dockerfile, target: backend}
    command: [node, dist/apps/mcp/src/main.js]
    environment:
      <<: *app-env
      NODE_ENV: production
      INTERNAL_API_URL: http://api:3001
      REDIS_URL: redis://redis:6379
    restart: unless-stopped
    init: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3002/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
  ssh-worker:
    image: nexusssh-ssh-worker:latest
    build: {context: ., dockerfile: infrastructure/docker/Dockerfile, target: backend}
    command: [node, dist/workers/ssh-worker/src/main.js]
    environment:
      <<: *app-env
      NODE_ENV: production
      INTERNAL_API_URL: http://api:3001
      REDIS_URL: redis://redis:6379
    restart: unless-stopped
    init: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    depends_on:
      api: {condition: service_healthy}
  redis:
    image: redis:7.4-alpine
    command: [redis-server, --save, '', --appendonly, 'no', --maxmemory, 128mb, --maxmemory-policy, noeviction]
    restart: unless-stopped
    volumes: [redis_data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 3s
      retries: 5
  nginx:
    image: nginx:1.28-alpine
    ports: ['${HTTP_PORT:-8080}:80']
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    depends_on:
      web: {condition: service_healthy}
      mcp: {condition: service_healthy}
volumes:
  nexusssh_data:
  redis_data:
