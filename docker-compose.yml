name: nexusssh
services:
  api:
    image: nexusssh-api:latest
    build: {context: ., dockerfile: infrastructure/docker/Dockerfile, target: backend}
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: file:/app/data/nexusssh.db
      REDIS_URL: redis://redis:6379
      INTERNAL_API_URL: http://api:3001
    volumes: [nexusssh_data:/app/data]
    restart: unless-stopped
    init: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    depends_on:
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
  web:
    image: nexusssh-web:latest
    build: {context: ., dockerfile: infrastructure/docker/Dockerfile, target: web}
    environment: {API_URL: 'http://api:3001', NEXT_TELEMETRY_DISABLED: '1'}
    restart: unless-stopped
    init: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 10
  mcp:
    image: nexusssh-mcp:latest
    build: {context: ., dockerfile: infrastructure/docker/Dockerfile, target: backend}
    command: [node, dist/apps/mcp/src/main.js]
    env_file: .env
    environment: {NODE_ENV: production, INTERNAL_API_URL: 'http://api:3001', REDIS_URL: 'redis://redis:6379'}
    restart: unless-stopped
    init: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3002/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
  ssh-worker:
    image: nexusssh-ssh-worker:latest
    build: {context: ., dockerfile: infrastructure/docker/Dockerfile, target: backend}
    command: [node, dist/workers/ssh-worker/src/main.js]
    env_file: .env
    environment: {NODE_ENV: production, INTERNAL_API_URL: 'http://api:3001', REDIS_URL: 'redis://redis:6379'}
    restart: unless-stopped
    init: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    depends_on:
      api: {condition: service_healthy}
  redis:
    image: redis:7.4-alpine
    command: [redis-server, --save, '', --appendonly, 'no', --maxmemory, 128mb, --maxmemory-policy, noeviction]
    restart: unless-stopped
    volumes: [redis_data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 3s
      retries: 5
  nginx:
    image: nginx:1.28-alpine
    ports: ['80:80', '443:443']
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    restart: unless-stopped
    depends_on:
      web: {condition: service_healthy}
      mcp: {condition: service_healthy}
volumes:
  nexusssh_data:
  redis_data:
