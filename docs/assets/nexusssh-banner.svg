<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title description">
  <title id="title">NexusSSH — Centralized SSH, Kubernetes and MCP</title>
  <desc id="description">A self-hosted web workspace connects people and MCP clients to SSH servers and Kubernetes. Infrastructure credentials stay on the NexusSSH deployment, behind scoped access, approvals and audit.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#101f35"/></linearGradient>
    <linearGradient id="accent" x2="1" y2="1"><stop stop-color="#22d3ee"/><stop offset="1" stop-color="#6366f1"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#155e75" stop-opacity=".38"/><stop offset="1" stop-color="#155e75" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#2b4261" opacity=".48"/></pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="m1 1 8 4-8 4" fill="none" stroke="#5f9aa8" stroke-width="1.8"/></marker>
  </defs>
  <rect x="1" y="1" width="1198" height="458" rx="26" fill="url(#background)" stroke="#263a55"/>
  <rect x="640" y="14" width="544" height="432" rx="22" fill="url(#grid)"/>
  <ellipse cx="902" cy="222" rx="324" ry="226" fill="url(#glow)"/>
  <path d="M641 48v364" stroke="#24364e" stroke-dasharray="2 9"/>

  <g font-family="Segoe UI, Inter, Arial, sans-serif">
    <rect x="56" y="49" width="56" height="56" rx="15" fill="url(#accent)"/>
    <g transform="translate(67 61) scale(2.05)" fill="#07111f"><path d="M2 2.5 9 8l-7 5.5V11l4-3-4-3z"/><rect x="8.5" y="12" width="6" height="2" rx="1"/></g>
    <text x="130" y="90" font-size="46" font-weight="700" letter-spacing="-1.5" fill="#f1f5f9">NexusSSH</text>
    <text x="57" y="151" font-size="11" font-weight="600" letter-spacing="2.8" fill="#67e8f9">YOUR INFRASTRUCTURE. ONE WORKSPACE.</text>
    <text x="54" y="208" font-size="37" font-weight="650" letter-spacing="-.9" fill="#f8fafc">Centralized access.</text>
    <text x="54" y="254" font-size="37" font-weight="650" letter-spacing="-.9" fill="#f8fafc">Built for people and AI.</text>
    <text x="57" y="293" font-size="18" fill="#9eb2cb">Web-based SSH · Kubernetes · MCP</text>
    <rect x="56" y="322" width="491" height="43" rx="11" fill="#0c2930" stroke="#1b535a"/>
    <path d="m80 334 8 3v6c0 5-8 9-8 9s-8-4-8-9v-6z" fill="none" stroke="#5eead4" stroke-width="1.7"/>
    <path d="m76 342 3 3 5-6" fill="none" stroke="#5eead4" stroke-width="1.7"/>
    <text x="104" y="349" font-size="16" font-weight="500" fill="#baf5e8">Infrastructure credentials stay with you.</text>
    <text x="57" y="408" font-size="11" letter-spacing="1.5" fill="#7f98b6">SELF-HOSTED</text>
    <circle cx="168" cy="404" r="2" fill="#38738a"/>
    <text x="184" y="408" font-size="11" letter-spacing="1.5" fill="#7f98b6">SCOPED ACCESS</text>
    <circle cx="318" cy="404" r="2" fill="#38738a"/>
    <text x="334" y="408" font-size="11" letter-spacing="1.5" fill="#7f98b6">HUMAN APPROVALS</text>

    <g fill="none" stroke="#5f9aa8" stroke-width="1.6" marker-end="url(#arrow)">
      <path d="M789 124v22h91v26"/>
      <path d="M1027 124v22h-83v26"/>
      <path d="M919 287v24H789v20"/>
      <path d="M919 311h108v20"/>
    </g>
    <rect x="694" y="53" width="190" height="71" rx="12" fill="#101f33" stroke="#304963"/>
    <rect x="711" y="72" width="26" height="20" rx="4" fill="none" stroke="#7dd3fc" stroke-width="1.5"/>
    <path d="M711 78h26M717 75h1m3 0h1" stroke="#7dd3fc" stroke-width="1.5"/>
    <text x="750" y="84" font-size="15" font-weight="600" fill="#e2e8f0">Web workspace</text>
    <text x="750" y="105" font-size="12" fill="#8fa8c4">People and teams</text>
    <rect x="932" y="53" width="190" height="71" rx="12" fill="#101f33" stroke="#304963"/>
    <g fill="none" stroke="#a5b4fc" stroke-width="1.6"><path d="m954 78 13 8-13 8m0-16v16m13-8h-18"/><circle cx="954" cy="78" r="3" fill="#101f33"/><circle cx="967" cy="86" r="3" fill="#101f33"/><circle cx="954" cy="94" r="3" fill="#101f33"/></g>
    <text x="982" y="84" font-size="15" font-weight="600" fill="#e2e8f0">MCP clients</text>
    <text x="982" y="105" font-size="12" fill="#8fa8c4">AI tools and agents</text>

    <rect x="742" y="172" width="354" height="115" rx="16" fill="#0c2534" stroke="#2dd4bf" stroke-opacity=".7"/>
    <rect x="760" y="190" width="33" height="33" rx="9" fill="#103b49"/>
    <path d="m772 198 8 8-8 8m10 0h5" fill="none" stroke="#5eead4" stroke-width="2"/>
    <text x="807" y="214" font-size="24" font-weight="650" letter-spacing="-.5" fill="#f0fdfa">NexusSSH</text>
    <text x="763" y="244" font-size="14" fill="#b6d8df">Encrypted credentials</text>
    <text x="763" y="267" font-size="13" fill="#7fa9b7">Policies · approvals · audit</text>
    <rect x="1006" y="193" width="70" height="23" rx="11.5" fill="#123d3d"/>
    <circle cx="1020" cy="205" r="3" fill="#5eead4"/>
    <text x="1030" y="209" font-size="10" font-weight="600" fill="#99f6e4">SCOPED</text>

    <rect x="694" y="331" width="190" height="76" rx="12" fill="#101f33" stroke="#304963"/>
    <g fill="none" stroke="#7dd3fc" stroke-width="1.5"><rect x="712" y="351" width="25" height="12" rx="3"/><rect x="712" y="368" width="25" height="12" rx="3"/><path d="M718 357h1m-1 17h1m9-17h4m-4 17h4"/></g>
    <text x="750" y="361" font-size="15" font-weight="600" fill="#e2e8f0">SSH servers</text>
    <text x="750" y="384" font-size="12" fill="#8fa8c4">Terminals and SFTP</text>
    <rect x="932" y="331" width="190" height="76" rx="12" fill="#101f33" stroke="#304963"/>
    <g fill="none" stroke="#a5b4fc" stroke-width="1.5"><path d="m960 349 13 7v16l-13 7-13-7v-16zM947 356l13 8 13-8m-13 8v15"/><circle cx="960" cy="364" r="2" fill="#a5b4fc"/></g>
    <text x="982" y="361" font-size="15" font-weight="600" fill="#e2e8f0">Kubernetes</text>
    <text x="982" y="384" font-size="12" fill="#8fa8c4">Clusters and workloads</text>
    <text x="909" y="438" text-anchor="middle" font-size="12" fill="#7793b2">AI clients connect with scoped MCP tokens.</text>
  </g>
</svg>
