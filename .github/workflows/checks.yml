name: Verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    # Never execute untrusted fork code on the persistent host.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 60
    runs-on: [self-hosted, Linux, X64, nexusssh]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm}
      - run: npm ci
      - run: docker compose config --quiet
      - run: python3 tests/recovery_bundle_test.py
      - name: Build commit image
        run: docker build --build-arg APP_REVISION="$GITHUB_SHA" -f infrastructure/docker/Dockerfile -t "nexusssh:${GITHUB_SHA}" .
      - uses: actions/setup-go@v5
        with: {go-version-file: services/vpn-gateway/go.mod, cache-dependency-path: services/vpn-gateway/go.sum}
      - run: go test -race ./...
        working-directory: services/vpn-gateway
      - run: npm run setup && npm run db:generate && npm run db:migrate
      - run: npm run lint && npm run typecheck && npm run build
      - run: docker compose -f tests/fixtures/compose.yml up -d --build
      - run: npm test
        env: {RUN_INTEGRATION: '1'}
      # Browser tests run against a native stack that can reach the SSH fixture.
      - run: npx playwright install chromium
      - run: sed -i 's#^SSH_ALLOWED_CIDRS=.*#SSH_ALLOWED_CIDRS=127.0.0.1/32#; s#^REDIS_URL=.*#REDIS_URL=redis://127.0.0.1:26379#' .env
      - run: |
          (npm run dev > dev.log 2>&1 &)
          curl -sf --retry 60 --retry-connrefused --retry-delay 3 http://127.0.0.1:3001/api/health
          curl -sf --retry 60 --retry-connrefused --retry-delay 3 -o /dev/null http://localhost:3000
      - run: npx playwright test
        env: {E2E_URL: 'http://localhost:3000', E2E_SSH: '1'}
      # Rollback archives are kept only for main and tags, and only after every check
      # passes; artifact storage limits must never fail verification.
      - name: Save rollback reference
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        run: |
          IMAGE_ID=$(docker image inspect "nexusssh:${GITHUB_SHA}" --format '{{.Id}}')
          printf 'image=nexusssh:%s\nimage_id=%s\nsource_commit=%s\n' "$GITHUB_SHA" "$IMAGE_ID" "$GITHUB_SHA" > image-manifest.txt
          docker save "nexusssh:${GITHUB_SHA}" | gzip -1 > nexusssh-image.tar.gz
      - if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: image-rollback-${{ github.sha }}
          path: |
            image-manifest.txt
            nexusssh-image.tar.gz
          retention-days: 7
      - if: failure()
        run: tail -n 200 dev.log
      - if: always()
        run: |
          docker compose -f tests/fixtures/compose.yml down --remove-orphans
          docker compose --project-directory . -f infrastructure/compose/vpn-dev.yml down --remove-orphans
  publish:
    needs: test
    # Releases publish their own images; see publish.yml.
    if: github.event_name == 'push' && github.ref == 'refs/heads/development'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish.yml
  # Deploy after the image is published, so the deployment can pull it.
  deploy:
    needs: [test, publish]
    if: github.event_name == 'push' && github.ref == 'refs/heads/development'
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
