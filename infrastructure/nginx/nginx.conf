limit_req_zone $binary_remote_addr zone=mcp_limit:10m rate=10r/s;
server { listen 80; server_name _; return 308 https://$host$request_uri; }
server {
 listen 443 ssl;
 server_name _;
 ssl_certificate /etc/nginx/certs/fullchain.pem;
 ssl_certificate_key /etc/nginx/certs/privkey.pem;
 ssl_protocols TLSv1.2 TLSv1.3;
 add_header Strict-Transport-Security "max-age=31536000" always;
 client_max_body_size 2m;
 proxy_set_header Host $http_host;
 proxy_set_header X-Forwarded-Proto https;
 location /api/internal/ { return 404; }
 location /api/ { proxy_pass http://api:3001; proxy_read_timeout 100s; }
 location /mcp { limit_req zone=mcp_limit burst=30 nodelay; proxy_pass http://mcp:3002; proxy_buffering off; proxy_read_timeout 110s; }
 location /ws/ { proxy_pass http://api:3001; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_read_timeout 360s; }
 location / { proxy_pass http://web:3000; }
}
