# Local override: builds the image from this checkout and binds it to loopback.
# Use it with the base file:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
services:
  nexusssh:
    image: nexusssh:local
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
      args:
        APP_REVISION: ${APP_REVISION:-unknown}
    pull_policy: build
    environment:
      APP_URL: ${APP_URL:-http://localhost:8080}
    ports: !override ['127.0.0.1:${HTTP_PORT:-8080}:8080']
