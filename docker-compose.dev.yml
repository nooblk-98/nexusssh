# Local development stack: builds the image from this checkout, runs its own
# Redis, and binds the published port to loopback.
#
# It is a complete stack, so it also works on its own. That matters for Git
# stacks (Portainer and similar) that can only point at a single compose file:
#   docker compose -f docker-compose.dev.yml up -d --build
# Merging it over the base file keeps working and is still the shortest path:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
name: nexusssh

services:
  nexusssh:
    image: nexusssh:local
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
      args:
        APP_REVISION: ${APP_REVISION:-unknown}
    pull_policy: build
    environment:
      # Empty by default, so the app answers on whatever address it is reached at
      # (localhost, a LAN IP, a proxy hostname). Set it to pin one HTTPS origin.
      APP_URL: ${APP_URL:-}
      # The bundled redis service below; the API, MCP and SSH worker all queue through it.
      REDIS_URL: redis://redis:6379
    ports: !override ['${DEV_BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-8080}:8080']
    volumes: [nexusssh_data:/app/data, nexusssh_secrets:/app/secrets]
    restart: unless-stopped
    init: true
    security_opt: !override [no-new-privileges:true]
    cap_drop: !override [ALL]
    depends_on:
      redis: {condition: service_healthy}
    healthcheck:
      test: !override [CMD, node, -e, "fetch('http://127.0.0.1:8080/api/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 10
  redis:
    image: redis:7.4-alpine
    command: !override [redis-server, --save, '', --appendonly, 'no', --maxmemory, 128mb, --maxmemory-policy, noeviction]
    restart: unless-stopped
    volumes: !override [redis_data:/data]
    healthcheck:
      test: !override [CMD, redis-cli, ping]
      interval: 10s
      timeout: 3s
      retries: 5
volumes:
  nexusssh_data:
  nexusssh_secrets:
  redis_data:
